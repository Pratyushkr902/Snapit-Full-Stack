[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://checkout.razorpay.com https://cdn.razorpay.com https://*.googleapis.com; connect-src 'self' https://snapit-backend-production.up.railway.app wss://snapit-backend-production.up.railway.app https://*.googleapis.com https://*.firebaseio.com https://lumberjack.razorpay.com https://checkout.razorpay.com https://*.tile.openstreetmap.org; img-src 'self' data: blob: https://res.cloudinary.com https://api.qrserver.com https://*.googleusercontent.com https://*.tile.openstreetmap.org https://cdn-icons-png.flaticon.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com; frame-src 'self' https://checkout.razorpay.com;"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
