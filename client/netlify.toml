[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com https://*.googleapis.com; connect-src 'self' https://snapit-full-stack-production.up.railway.app wss://snapit-full-stack-production.up.railway.app https://*.googleapis.com https://*.firebaseio.com https://lumberjack.razorpay.com https://lumberjack-dx.razorpay.com; img-src 'self' data: blob: https://res.cloudinary.com https://api.qrserver.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://checkout.razorpay.com;"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
