<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapit - Hyperlocal Grocery</title>

    <!-- ✅ FIXED: Added cdn.razorpay.com to allow Razorpay risk bundle -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline'
        https://checkout.razorpay.com
        https://cdn.razorpay.com
        https://*.googleapis.com
        https://unpkg.com;
      connect-src 'self'
        https://snapit-full-stack-2.onrender.com
        wss://snapit-full-stack-2.onrender.com
        https://checkout.razorpay.com
        https://cdn.razorpay.com
        https://lumberjack.razorpay.com
        https://lumberjack-dx.razorpay.com;
      img-src 'self' data: blob:
        https://res.cloudinary.com
        https://snapit-full-stack-2.onrender.com
        https://*.googleusercontent.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      frame-src https://api.razorpay.com https://checkout.razorpay.com;
    ">

    <link rel="manifest" href="/manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
      }
    </script>

    <!-- Razorpay Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
