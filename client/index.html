<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Snapit - Hyperlocal Grocery</title>

    <!-- Preconnect to your Railway backend API -->
    <link rel="preconnect" href="https://snapit-full-stack-production.up.railway.app" crossorigin>

    <link rel="manifest" href="/manifest.json">

    <!-- Tabler icons, used by StoreClosedOverlay -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .catch(err => console.error('ServiceWorker registration failed: ', err));
        });
      }
    </script>

    <!-- Deferred: was blocking initial render before -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
